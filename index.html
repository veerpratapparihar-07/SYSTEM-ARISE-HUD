    // --- SOUND & HAPTICS ENGINE ---
    function triggerFeedback(type, soundEnabled = true, hapticsEnabled = true) {
      if (hapticsEnabled && navigator.vibrate) {
        if (type === "levelup" || type === "arise") navigator.vibrate([40, 60, 80]);
        else if (type === "danger") navigator.vibrate([80, 40, 80]);
        else navigator.vibrate(18);
      }
      if (!soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        if (type === "click") {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(980, now);
          osc.frequency.exponentialRampToValueAtTime(1620, now + 0.055);
          gain.gain.setValueAtTime(0.07, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.065);
        } else if (type === "levelup") {
          [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, now + idx * 0.075);
            gain.gain.setValueAtTime(0.12, now + idx * 0.075);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.075 + 0.38);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.075);
            osc.stop(now + idx * 0.075 + 0.38);
          });
        } else if (type === "arise") {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(95, now);
          osc.frequency.exponentialRampToValueAtTime(420, now + 0.65);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.7);
        } else if (type === "danger") {
          [300, 210].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "square";
            osc.frequency.setValueAtTime(freq, now + idx * 0.14);
            gain.gain.setValueAtTime(0.09, now + idx * 0.14);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.13);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.14);
            osc.stop(now + idx * 0.14 + 0.13);
          });
        }
      } catch (e) {}
    }

    // --- SVG RADAR ATTRIBUTE CHART ---
    function AttributeRadarChart({ stats, primary, accent }) {
      const topStats = stats.slice(0, 6);
      const count = topStats.length;
      if (count < 3) return null;
      const maxVal = Math.max(250, ...topStats.map((s) => s.val));
      const cx = 110;
      const cy = 110;
      const r = 74;

      const getPoint = (idx, ratio) => {
        const angle = (Math.PI * 2 * idx) / count - Math.PI / 2;
        return [
          cx + r * ratio * Math.cos(angle),
          cy + r * ratio * Math.sin(angle)
        ];
      };

      const polygonPoints = topStats
        .map((s, idx) => getPoint(idx, Math.min(1, Math.max(0.12, s.val / maxVal))).join(","))
        .join(" ");

      return (
        <div className="flex flex-col items-center justify-center p-2">
          <svg width="220" height="220" viewBox="0 0 220 220">
            {[0.25, 0.5, 0.75, 1].map((lvl) => (
              <polygon
                key={lvl}
                points={topStats.map((_, idx) => getPoint(idx, lvl).join(",")).join(" ")}
                fill="none"
                stroke={`${primary}33`}
                strokeWidth="1"
              />
            ))}
            {topStats.map((s, idx) => {
              const [x, y] = getPoint(idx, 1);
              const [lx, ly] = getPoint(idx, 1.22);
              return (
                <g key={s.id}>
                  <line x1={cx} y1={cy} x2={x} y2={y} stroke={`${primary}33`} strokeWidth="1" />
                  <text
                    x={lx}
                    y={ly}
                    fill={primary}
                    fontSize="10"
                    fontWeight="bold"
                    textAnchor="middle"
                    dominantBaseline="middle"
                  >
                    {s.name.split(" ")[0]}
                  </text>
                </g>
              );
            })}
            <polygon
              points={polygonPoints}
              fill={`${primary}44`}
              stroke={accent}
              strokeWidth="2.5"
            />
          </svg>
        </div>
      );
    }

        const ctx = canvas.getContext("2d");
        let animId;
        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resize();
        window.addEventListener("resize", resize);

        const count = state.ui.particleCount || 40;
        const particles = Array.from({ length: count }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.45,
          vy: -Math.random() * 0.65 - 0.15,
          size: Math.random() * 2.4 + 0.8,
          alpha: Math.random() * 0.65 + 0.15
        }));

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            if (p.y < 0) p.y = canvas.height;
            if (p.x < 0) p.x = canvas.width;
            if (p.x > canvas.width) p.x = 0;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = palette.primary;
            ctx.globalAlpha = p.alpha;
            ctx.shadowBlur = 10;
            ctx.shadowColor = palette.primary;
            ctx.fill();
          });
          animId = requestAnimationFrame(render);
        };
        render();
        return () => {

        const finalXp = xpDelta * mult;
        const finalGold = goldDelta * mult;

        setState((prev) => {
          let newXp = prev.hunter.xp + finalXp;
          let newLevel = prev.hunter.level;
          let newAp = prev.hunter.ap;
          let newMaxHp = prev.hunter.maxHp;
          let newMaxMp = prev.hunter.maxMp;
          let leveledUp = false;

          let reqXp = Math.floor(
            prev.backend.baseXpPerLevel * Math.pow(prev.backend.xpGrowthFactor, Math.max(0, newLevel - 1))
          );

          while (newXp >= reqXp) {
            newXp -= reqXp;
            newLevel += 1;
            newAp += prev.backend.apPerLevel;
            newMaxHp += prev.backend.hpPerLevel;
            newMaxMp += prev.backend.mpPerLevel;
            leveledUp = true;
            reqXp = Math.floor(
              prev.backend.baseXpPerLevel * Math.pow(prev.backend.xpGrowthFactor, Math.max(0, newLevel - 1))
            );
          }

          if (leveledUp) {
            setTimeout(() => {
              triggerBanner("LEVEL UP!", `RANK ASCENSION // LEVEL ${newLevel} (+${prev.backend.apPerLevel} AP)`);
              notify(`LEVEL UP! Reached Level ${newLevel}`, "levelup");
            }, 40);
          } else {
            setTimeout(() => notify(`${label}: +${finalXp} XP, +${finalGold} G`, "info"), 40);
          }

          return {
            ...prev,
            hunter: {
              ...prev.hunter,
              level: newLevel,
              xp: newXp,
              gold: prev.hunter.gold + finalGold,
              ap: newAp,
              maxHp: newMaxHp,
              hp: leveledUp ? newMaxHp : prev.hunter.hp,
              maxMp: newMaxMp,
              mp: leveledUp ? newMaxMp : prev.hunter.mp
            }
          };
        });
      };

      // Stat Handlers
      const allocateStat = (id, delta) => {
        setState((prev) => {
          if (delta > 0 && prev.hunter.ap < delta) {
            notify("Insufficient Ability Points (AP)!", "danger");
            return prev;
          }
          triggerFeedback("click", prev.ui.soundEnabled, prev.ui.hapticsEnabled);
          return {
            ...prev,
            hunter: {
              ...prev.hunter,
              ap: prev.hunter.ap - delta,
              stats: prev.hunter.stats.map((s) =>
                s.id === id ? { ...s, val: Math.max(1, s.val + delta) } : s
              )
            }
          };
        });
      };

      const addCustomStat = () => {
        if (!newStatName.trim()) return;
        setState((prev) => ({
          ...prev,
          hunter: {
            ...prev.hunter,
            stats: [
              ...prev.hunter.stats,
              {
                id: "st_" + Date.now(),
                name: newStatName.trim().toUpperCase(),
                val: 25,
                desc: newStatDesc.trim() || "Custom Hunter Attribute"
              }
            ]
          }
        }));
        setNewStatName("");
        setNewStatDesc("");
        notify("Custom attribute registered into Status Window.");
      };

      const removeStat = (id) => {
        setState((prev) => ({
          ...prev,
          hunter: {
            ...prev.hunter,
            stats: prev.hunter.stats.filter((s) => s.id !== id)
          }
        }));
      };

      // Photo Upload Handler
      const handlePhotoUpload = (e, target = "hunter") => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          if (target === "hunter") {
            setState((prev) => ({
              ...prev,
              hunter: { ...prev.hunter, avatarUrl: reader.result }
            }));
            notify("Hunter ID Biometric Photo Updated!");
          } else if (target === "shadow") {
            setShadowImageUrl(reader.result);
            notify("Shadow Soldier Portrait Loaded!");
          }
        };
        reader.readAsDataURL(file);
      };

      // Quest Handlers
      const updateQuestProgress = (qId, delta) => {
        setState((prev) => ({
          ...prev,
          quests: prev.quests.map((q) => {
            if (q.id !== qId) return q;
            const nextVal = Math.max(0, Math.min(q.target, q.current + delta));
            return { ...q, current: nextVal };
          })
        }));
        triggerFeedback("click", state.ui.soundEnabled, state.ui.hapticsEnabled);
      };

      const claimDailyReward = () => {
        const allDone = state.quests.every((q) => q.current >= q.target);
        if (!allDone) {
          notify("Complete all Daily Quests before claiming the System Reward!", "danger");
          return;
        }
        if (state.dailyClaimed) {
          notify("Daily Quest reward already claimed today!", "info");
          return;
        }
        setState((prev) => ({
          ...prev,
          dailyClaimed: true,
          penaltyMode: false,
          hunter: {
            ...prev.hunter,
            streak: (prev.hunter.streak || 1) + 1,
            hp: prev.hunter.maxHp,
            mp: prev.hunter.maxMp,
            fatigue: 0,
            ap: prev.hunter.ap + 3
          }
        }));
        triggerBanner("DAILY QUEST CLEARED", "FULL STATUS RECOVERY & +3 ABILITY POINTS");
        gainRewards(600, 3000, "DAILY QUEST COMPLETED");
      };

      const generateAiSideQuest = () => {
        const pick = AI_QUEST_TEMPLATES[Math.floor(Math.random() * AI_QUEST_TEMPLATES.length)];
        setState((prev) => ({
          ...prev,
          quests: [
            ...prev.quests,
            {
              id: "aiq_" + Date.now(),
              title: `[EMERGENCY] ${pick.title}`,
              target: pick.target,
              current: 0,
              unit: pick.unit,
              xp: pick.xp,
              gold: pick.gold
            }
          ]
        }));
        notify(`Emergency Directive Issued: ${pick.title}!`, "levelup");

      const addCustomQuest = () => {
        if (!newQuestTitle.trim()) return;
        setState((prev) => ({
          ...prev,
          quests: [
            ...prev.quests,

              title: newQuestTitle.trim(),
              target: Number(newQuestTarget) || 50,
              current: 0,
              unit: newQuestUnit || "reps",
              xp: 200,
              gold: 600
            }
          ]
        }));
        setNewQuestTitle("");
        notify("New Daily Directive added.");
      };

      // Inventory & Store
      const useOrEquipItem = (item) => {
        if (item.type === "WEAPON") {
          setState((prev) => ({
            ...prev,
            inventory: prev.inventory.map((i) =>

        } else {
          setState((prev) => ({
            ...prev,
            hunter: {
              ...prev.hunter,
              hp: prev.hunter.maxHp,
              mp: prev.hunter.maxMp,
              fatigue: 0

            inventory: prev.inventory

              .filter((i) => i.qty > 0)
          }));
          notify(`Consumed ${item.name}! Full Status Recovery applied.`, "levelup");
        }
      };

      const buyStoreItem = (sItem) => {
        if (state.hunter.gold < sItem.cost) {
          notify("Insufficient Gold in System Wallet!", "danger");
          return;

        setState((prev) => {

            : [
                ...prev.inventory,
                {
                  id: "inv_" + Date.now(),
                  name: sItem.name,
                  type: sItem.type,
                  rarity: sItem.rarity,
                  qty: 1,
                  effect: sItem.effect,
                  equipped: false
                }
              ];
          return {
            ...prev,
            hunter: { ...prev.hunter, gold: prev.hunter.gold - sItem.cost },
            inventory: updatedInv
          };
        });
        notify(`Purchased [${sItem.name}]! Added to Inventory.`);

      const addCustomStoreItem = () => {

        setState((prev) => ({

        notify("ARISE! Shadow Soldier status updated.", "arise");
      };

      const createCustomShadow = () => {
        if (!shadowName.trim()) {
          notify("Enter a Shadow Soldier name before calling ARISE!", "danger");
          return;
        }
        const newShadow = {
          id: "sh_" + Date.now(),
          name: shadowName.trim().toUpperCase(),
          title: shadowTitle.trim() || "Shadow Legionnaire",
          grade: shadowGrade,
          unlocked: true,
          bonus: shadowBonus.trim() || "+15% All Stats",
          quote: shadowQuote.trim() || "I obey the Shadow Monarch.",
          imageUrl: shadowImageUrl
        };
        setState((prev) => ({
          ...prev,
          shadows: [newShadow, ...prev.shadows]
        }));
        setShadowName("");
        setShadowTitle("");
        setShadowImageUrl("");
        triggerBanner("A R I S E", `${newShadow.name} HAS JOINED THE SHADOW LEGION`);
        notify(`"ARISE!" — [${newShadow.name}] extracted!`, "arise");
      };

      // Command Console Directives
      const executeCommand = (rawCmd) => {
        const cmd = (rawCmd || commandInput).trim().toUpperCase();
        if (!cmd) return;
        setCommandInput("");
        if (cmd === "ARISE") {
          setActiveTab("shadows");
          triggerBanner("A R I S E", "SUMMONING THE MONARCH'S LEGION");
          notify("ARISE! Calling forth the Shadow Army...", "arise");
        } else if (cmd === "RECOVER") {
          setState((prev) => ({
            ...prev,
            hunter: { ...prev.hunter, hp: prev.hunter.maxHp, mp: prev.hunter.maxMp, fatigue: 0 }
          }));
          notify("Full Status Recovery Activated!", "levelup");
        } else if (cmd === "LEVEL UP") {
          gainRewards(maxXpForLevel, 5000, "DIRECTIVE: INSTANT LEVEL UP");
        } else if (cmd === "CLAIM") {
          claimDailyReward();
        } else if (cmd === "STATUS") {
          setActiveTab("status");
          notify("Opening Hunter Status Window.");
        } else if (cmd === "PENALTY") {
          setState((prev) => ({ ...prev, penaltyMode: !prev.penaltyMode }));
          triggerBanner("PENALTY ZONE", "SURVIVE THE BLOOD-RED TRIAL");
          notify("Penalty Zone Protocol Toggled!", "danger");
        } else {
          notify(`Executed System Directive: [${cmd}]`);
        }
      };

      // Google Account Identity Vault Binding
      const bindGoogleVault = () => {
        if (!gEmail.trim() || !gEmail.includes("@")) {
          notify("Please enter a valid Google Email (@gmail.com or Workspace).", "danger");
          return;
        }
        const cleanEmail = gEmail.trim().toLowerCase();
        setState((prev) => ({
          ...prev,
          hunter: {
            ...prev.hunter,
            name: gName.trim() ? gName.trim().toUpperCase() : prev.hunter.name
          },
          googleVault: {
            ...prev.googleVault,
            bound: true,
            email: cleanEmail,
            displayName: gName.trim() || prev.hunter.name,
            vaultPin: gPin,
            lastSynced: new Date().toLocaleTimeString()
          }
        }));
        setShowGoogleModal(false);
        notify(`Bound privately to Google Vault: ${cleanEmail}`, "levelup");
      };

      const restoreFromGoogleVault = () => {
        if (!gEmail.trim()) return;
        const key = `SOLO_GVAULT_${gEmail.trim().toLowerCase()}`;
        const saved = localStorage.getItem(key);
        if (!saved) {
          notify("No existing cloud snapshot found for that Google Email on this device.", "danger");
          return;
        }
        try {
          const parsed = JSON.parse(saved);
          setState(parsed);
          setShowGoogleModal(false);
          notify(`Restored Hunter Data from ${gEmail.trim()}!`, "levelup");
        } catch (e) {
          notify("Failed to parse Vault snapshot.", "danger");
        }
      };

      // --- 100 SINGLE-USE HIDDEN ACCESS CODE VERIFICATION & BURN ENGINE ---
      const verifyMonarchLicense = () => {
        const cleanCode = licenseInput.trim().toUpperCase();
        if (!cleanCode) {
          notify("Please enter a Monarch Pro Pass access code.", "danger");
          return;
        }

        const candidateHash = sha256Pure(VAULT_SALT + cleanCode);
        const slotIndex = VALID_MONARCH_HASHES.indexOf(candidateHash);

        if (slotIndex === -1) {
          notify("INVALID ACCESS CODE! Check your code and try again.", "danger");
          return;
        }

        const allBurned = new Set([
          ...(burnedHashesRegistry || []),
          ...(state.monetization.burnedHashes || [])
        ]);

        if (allBurned.has(candidateHash)) {
          notify(`CODE ALREADY USED! Access Code #${String(slotIndex + 1).padStart(3, "0")} has already been redeemed and permanently disabled.`, "danger");
          return;
        }

        // Burn this code permanently so it can NEVER be reused!
        const updatedBurned = Array.from(new Set([...allBurned, candidateHash]));
        setBurnedHashesRegistry(updatedBurned);

        const slotLabel = `#${String(slotIndex + 1).padStart(3, "0")}`;
        setState((prev) => ({
          ...prev,
          monetization: {
            ...prev.monetization,
            proUnlocked: true,
            redeemedCodeSlot: slotLabel,
            redeemedAt: new Date().toLocaleString(),
            burnedHashes: updatedBurned
          }
        }));
        setLicenseInput("");
        setShowProModal(false);
        setShowCheckoutGateway(false);
        triggerBanner("MONARCH PRO UNLOCKED", `SINGLE-USE CODE ${slotLabel} VERIFIED & LOCKED`);
        notify(`Monarch Pro Pass Activated via Single-Use Code ${slotLabel}! (Code is now permanently disabled for future use)`, "levelup");
      };

      // Admin manual burn slot (#1 to #100)
      const manualBurnSlot = () => {
        const num = parseInt(adminBurnSlotInput, 10);
        if (isNaN(num) || num < 1 || num > 100) {
          notify("Enter a valid Code Slot number between 1 and 100.", "danger");
          return;
        }
        const targetHash = VALID_MONARCH_HASHES[num - 1];
        const updated = Array.from(new Set([...burnedHashesRegistry, ...(state.monetization.burnedHashes || []), targetHash]));
        setBurnedHashesRegistry(updated);
        setState((prev) => ({
          ...prev,
          monetization: { ...prev.monetization, burnedHashes: updated }
        }));
        setAdminBurnSlotInput("");
        notify(`Code Slot #${String(num).padStart(3, "0")} has been permanently disabled/burned!`);
      };

      // UPI Deep Link & QR Generator
      const upiDeepLink = useMemo(() => {
        const pa = encodeURIComponent(state.monetization.upiId || "monarchsystem@upi");
        const pn = encodeURIComponent(state.monetization.payeeName || "THE SYSTEM ARCHITECT");
        const am = encodeURIComponent(state.monetization.priceAmountInr || "299");
        const tn = encodeURIComponent(`Monarch Pro Pass - ${state.hunter.name}`);
        return `upi://pay?pa=${pa}&pn=${pn}&am=${am}&cu=INR&tn=${tn}`;
      }, [state.monetization.upiId, state.monetization.payeeName, state.monetization.priceAmountInr, state.hunter.name]);

      const qrCodeImageUrl = useMemo(() => {
        return `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=10&data=${encodeURIComponent(upiDeepLink)}`;
      }, [upiDeepLink]);

      const handleVerifyPaymentReceipt = () => {
        if (!utrInput.trim() || utrInput.trim().length < 6) {
          notify("Please enter a valid 12-digit UPI Ref / UTR or Transaction ID.", "danger");
          return;
        }
        setPaymentSubmitted(true);
        notify("Payment Receipt Logged! Send the verification message to receive your unique Single-Use Access Code.", "levelup");

        const msgText = `Hello System Architect! I have completed the payment of ₹${state.monetization.priceAmountInr} for the MONARCH PRO PASS.\n\n• Hunter Name: ${state.hunter.name}\n• UTR / Transaction ID: ${utrInput.trim()}\n• Email: ${buyerEmailInput || "N/A"}\n\nPlease issue my single-use Monarch Pro Pass Access Code!`;

        if (state.monetization.whatsappNumber && state.monetization.whatsappNumber.trim()) {
          const cleanPhone = state.monetization.whatsappNumber.replace(/\D/g, "");
          window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msgText)}`, "_blank");
        } else if (state.monetization.supportEmail && state.monetization.supportEmail.trim()) {
          window.open(`mailto:${state.monetization.supportEmail.trim()}?subject=${encodeURIComponent("Monarch Pro Pass Payment UTR: " + utrInput.trim())}&body=${encodeURIComponent(msgText)}`, "_blank");
        }
      };

      const exportSystemJson = () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `solo_system_${state.hunter.name.toLowerCase().replace(/\s+/g, "_")}.json`;
        a.click();
        notify("Exported encrypted System JSON backup.");
      };

      const importSystemJson = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            setState((prev) => ({ ...prev, ...parsed }));
            notify("System Backup Restored Successfully!", "levelup");
          } catch (err) {
            notify("Invalid System JSON file.", "danger");
          }
        };
        reader.readAsText(file);
      };

      const totalBurnedCount = new Set([
        ...(burnedHashesRegistry || []),
        ...(state.monetization.burnedHashes || [])
      ]).size;

      // --- SUB-WINDOWS ---
      const renderStatusWindow = () => (
        <div style={getWindowStyle()} className="p-6 relative system-window-anim">
          <div className="flex flex-wrap items-center justify-between gap-4 border-b pb-4 mb-6" style={{ borderColor: `${palette.primary}44` }}>
            <div className="flex items-center gap-4">
              {/* Hunter ID Avatar */}
              <div className="relative group w-20 h-20 rounded-lg overflow-hidden border-2 flex items-center justify-center bg-slate-950" style={{ borderColor: palette.primary, boxShadow: `0 0 18px ${palette.primary}55` }}>
                {state.hunter.avatarUrl ? (
                  <img src={state.hunter.avatarUrl} alt="Hunter ID" className="w-full h-full object-cover" />
                ) : (
                  <div className="text-center text-xs font-bold opacity-80" style={{ color: palette.primary }}>
                    HUNTER<br />ID
                  </div>
                )}
                <label className="absolute inset-0 bg-black/75 opacity-0 group-hover:opacity-100 flex items-center justify-center text-[10px] font-bold cursor-pointer transition-opacity text-white text-center p-1">
                  UPLOAD PHOTO
                  <input type="file" accept="image/*" className="hidden" onChange={(e) => handlePhotoUpload(e, "hunter")} />
                </label>
              </div>
              <div>
                <div className="flex flex-wrap items-center gap-2">
                  <span className="text-xs px-2 py-0.5 font-bold rounded" style={{ background: `${palette.primary}33`, color: palette.primary, border: `1px solid ${palette.primary}` }}>
                    {state.hunter.rank}
                  </span>
                  <span className="text-xs tracking-widest opacity-80">[{state.hunter.job}]</span>
                  {state.monetization.proUnlocked && (
                    <span className="text-[10px] px-2 py-0.5 font-black rounded bg-amber-500/20 text-amber-300 border border-amber-400">
                      ★ MONARCH PRO ({state.monetization.redeemedCodeSlot || "ACTIVE"})
                    </span>
                  )}
                </div>
                <h2 className="text-2xl md:text-3xl font-black tracking-wider mt-1" style={{ textShadow: `0 0 ${state.ui.textGlow}px ${palette.primary}` }}>
                  {state.hunter.name}
                </h2>
                <p className="text-xs opacity-80 italic">Title: "{state.hunter.title}" • Streak: 🔥 {state.hunter.streak || 1} Days</p>
              </div>
            </div>

            <div className="flex items-center gap-4">
              <div className="text-right">
                <div className="text-3xl font-black" style={{ color: palette.primary, textShadow: `0 0 ${state.ui.textGlow}px ${palette.primary}` }}>
                  LV. {state.hunter.level}
                </div>
                <div className="text-xs opacity-80">
                  XP: {state.hunter.xp.toLocaleString()} / {maxXpForLevel.toLocaleString()}
                </div>
              </div>
              <button onClick={() => setShowIdModal(true)} style={getButtonStyle("secondary")} className="px-3 py-2 text-xs font-bold uppercase tracking-wider">
                Edit ID & Photo
              </button>
            </div>
          </div>

          {/* HP / MP / Fatigue Bars */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div className="p-3 rounded bg-black/40 border" style={{ borderColor: `${palette.primary}33` }}>
              <div className="flex justify-between text-xs font-bold mb-1">
                <span>HP (HEALTH)</span>
                <span>{state.hunter.hp} / {state.hunter.maxHp}</span>
              </div>
              <div className="w-full h-2.5 bg-slate-900 rounded overflow-hidden">
                <div className="h-full transition-all duration-500" style={{ width: `${Math.min(100, (state.hunter.hp / state.hunter.maxHp) * 100)}%`, background: "#ef4444", boxShadow: "0 0 10px #ef4444" }} />
              </div>
            </div>

            <div className="p-3 rounded bg-black/40 border" style={{ borderColor: `${palette.primary}33` }}>
              <div className="flex justify-between text-xs font-bold mb-1">
                <span>MP (MANA)</span>
                <span>{state.hunter.mp} / {state.hunter.maxMp}</span>
              </div>
              <div className="w-full h-2.5 bg-slate-900 rounded overflow-hidden">
                <div className="h-full transition-all duration-500" style={{ width: `${Math.min(100, (state.hunter.mp / state.hunter.maxMp) * 100)}%`, background: palette.primary, boxShadow: `0 0 10px ${palette.primary}` }} />
              </div>
            </div>

            <div className="p-3 rounded bg-black/40 border flex items-center justify-between" style={{ borderColor: `${palette.primary}33` }}>
              <div>
                <div className="text-xs font-bold opacity-75">FATIGUE: {state.hunter.fatigue}%</div>
                <div className="text-lg font-black" style={{ color: "#fbbf24" }}>
                  GOLD: {state.hunter.gold.toLocaleString()} G
                </div>
              </div>
              <div className="text-right">
                <span className="text-xs opacity-75 block">AVAILABLE AP</span>
                <span className="text-2xl font-black" style={{ color: palette.accent }}>{state.hunter.ap}</span>
              </div>
            </div>
          </div>

          {/* Stats List + Radar Chart + Custom Attribute */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-5 space-y-2.5">
              <h3 className="text-sm font-bold tracking-widest uppercase mb-2" style={{ color: palette.primary }}>
                [ HUNTER ATTRIBUTES ]
              </h3>
              {state.hunter.stats.map((st) => (
                <div key={st.id} className="flex items-center justify-between p-2.5 rounded bg-black/40 border" style={{ borderColor: `${palette.primary}33` }}>
                  <div>
                    <div className="font-bold text-sm">{st.name}</div>
                    <div className="text-[11px] opacity-65">{st.desc}</div>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span className="text-xl font-black px-2" style={{ color: palette.primary }}>{st.val}</span>
                    <button onClick={() => allocateStat(st.id, 1)} style={getButtonStyle("primary")} className="px-2.5 py-1 text-xs font-bold">

                <div className="flex justify-between items-center border-b pb-2" style={{ borderColor: `${palette.primary}44` }}>
                  <h3 className="text-lg font-black uppercase" style={{ color: palette.primary }}>
                    📲 INSTALL OR DOWNLOAD APP (PHONE & PC)
                  </h3>
                  <button onClick={() => setShowInstallModal(false)}>✕</button>
                </div>
                <div className="space-y-3 text-xs leading-relaxed">
                  <button
                    onClick={downloadSelfHtmlFile}
                    style={getButtonStyle("gold")}
                    className="w-full py-2.5 text-xs font-black uppercase"
                  >
                    💾 Click Here to Download index.html Directly
                  </button>
                  <div className="p-3 rounded bg-black/40 border" style={{ borderColor: `${palette.primary}33` }}>
                    <strong className="block mb-1" style={{ color: palette.primary }}>Android / Windows / macOS (Chrome or Edge):</strong>
                    Open your hosted GitHub Pages URL and tap the <strong>Install App icon</strong> in the address bar or browser menu (⋮) → <strong>"Install app"</strong>.
                  </div>
                  <div className="p-3 rounded bg-black/40 border" style={{ borderColor: `${palette.primary}33` }}>
                    <strong className="block mb-1" style={{ color: palette.primary }}>iPhone / iPad (Safari):</strong>
                    Tap <strong>Share</strong> at the bottom of Safari and select <strong>"Add to Home Screen"</strong>.
                  </div>
                </div>
                <button onClick={() => setShowInstallModal(false)} style={getButtonStyle("primary")} className="w-full py-2 text-xs font-bold uppercase">
                  Close
                </button>
              </div>
            </div>
          )}

          {/* EDIT HUNTER ID & PHOTO MODAL */}
          {showIdModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div style={getWindowStyle()} className="max-w-md w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-2" style={{ borderColor: `${palette.primary}44` }}>
                  <h3 className="text-lg font-black uppercase" style={{ color: palette.primary }}>EDIT HUNTER ID & PHOTO</h3>
                  <button onClick={() => setShowIdModal(false)}>✕</button>
                </div>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block mb-1 font-bold">Hunter Name</label>
                    <input
                      type="text"
                      value={state.hunter.name}
                      onChange={(e) => setState((prev) => ({ ...prev, hunter: { ...prev.hunter, name: e.target.value } }))}
                      className="w-full p-2 rounded bg-slate-950 border"
                      style={{ borderColor: `${palette.primary}55` }}
                    />
                  </div>
                  <div>
                    <label className="block mb-1 font-bold">Job / Class</label>
                    <input
                      type="text"
                      value={state.hunter.job}
                      onChange={(e) => setState((prev) => ({ ...prev, hunter: { ...prev.hunter, job: e.target.value } }))}
                      className="w-full p-2 rounded bg-slate-950 border"
                      style={{ borderColor: `${palette.primary}55` }}
                    />
                  </div>
                  <div>
                    <label className="block mb-1 font-bold">Title</label>
                    <input
                      type="text"
                      value={state.hunter.title}
                      onChange={(e) => setState((prev) => ({ ...prev, hunter: { ...prev.hunter, title: e.target.value } }))}
                      className="w-full p-2 rounded bg-slate-950 border"
                      style={{ borderColor: `${palette.primary}55` }}
                    />
                  </div>
                  <div>
                    <label className="block mb-1 font-bold">Upload ID Photo from Device</label>
                    <input type="file" accept="image/*" onChange={(e) => handlePhotoUpload(e, "hunter")} className="w-full text-xs" />
                  </div>
                </div>
                <button onClick={() => setShowIdModal(false)} style={getButtonStyle("primary")} className="w-full py-2 text-xs font-bold uppercase">
                  Save & Close
                </button>
              </div>
            </div>
          )}

          {/* GOOGLE ACCOUNT PRIVATE VAULT MODAL */}
          {showGoogleModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div style={getWindowStyle()} className="max-w-md w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-2" style={{ borderColor: `${palette.primary}44` }}>
                  <h3 className="text-lg font-black uppercase" style={{ color: palette.primary }}>GOOGLE ACCOUNT PRIVATE VAULT</h3>
                  <button onClick={() => setShowGoogleModal(false)}>✕</button>
                </div>
                <p className="text-xs opacity-80">
                  Bind your Google Account email to isolate and auto-save your Hunter progress in a dedicated encrypted vault slot.
                </p>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block mb-1 font-bold">Google Email (@gmail.com)</label>
                    <input
                      type="email"
                      placeholder="hunter@gmail.com"
                      value={gEmail}
                      onChange={(e) => setGEmail(e.target.value)}
                      className="w-full p-2 rounded bg-slate-950 border"
                      style={{ borderColor: `${palette.primary}55` }}
                    />
                  </div>
                  <div>
                    <label className="block mb-1 font-bold">Hunter Display Name</label>
                    <input
                      type="text"
                      value={gName}
                      onChange={(e) => setGName(e.target.value)}
                      className="w-full p-2 rounded bg-slate-950 border"
                      style={{ borderColor: `${palette.primary}55` }}
                    />
                  </div>
                  <div>
                    <label className="block mb-1 font-bold">Optional Private Vault PIN</label>
                    <input
                      type="password"
                      placeholder="••••"
                      value={gPin}
                      onChange={(e) => setGPin(e.target.value)}
                      className="w-full p-2 rounded bg-slate-950 border"
                      style={{ borderColor: `${palette.primary}55` }}
                    />
                  </div>
                </div>
                <div className="flex gap-2">
                  <button onClick={bindGoogleVault} style={getButtonStyle("primary")} className="flex-1 py-2 text-xs font-bold uppercase">
                    Bind & Save Vault
                  </button>
                  <button onClick={restoreFromGoogleVault} style={getButtonStyle("secondary")} className="flex-1 py-2 text-xs font-bold uppercase">
                    Restore Vault
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>

  <!-- Progressive Web App Service Worker Registration -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
